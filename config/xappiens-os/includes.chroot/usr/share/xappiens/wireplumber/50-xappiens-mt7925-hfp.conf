# XappiensOS: perfil de llamadas para Bluetooth MediaTek MT7925.
#
# Sólo se activa en equipos con ese chip: /usr/lib/xappiens/bt-quirks lo
# enlaza en /etc/wireplumber/wireplumber.conf.d/ al arrancar.
#
# Con mSBC (audio HD en llamadas) el micrófono de los auriculares se queda
# mudo tras la primera llamada en el MT7925 (BlueZ #2545/#2562); se desactiva.
# Ojo: cvsd no va en bluez5.codecs (esa lista es sólo de A2DP).
# Algunos auriculares (Sony) fallan con HSP+HFP a la vez: sólo HFP.

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hfp_ag ]
  bluez5.hfphsp-backend = "native"
  bluez5.enable-msbc = false
  bluez5.enable-sbc-xq = true
  bluez5.enable-hw-volume = true
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink hfp_ag ]
        bluez5.hw-volume = [ a2dp_sink hfp_ag ]
      }
    }
  }
]
