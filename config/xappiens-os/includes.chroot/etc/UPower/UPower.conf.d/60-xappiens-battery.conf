# XappiensOS: apagado limpio antes de que la batería se agote.
#
# Por defecto UPower intenta HybridSleep al 2 %. En una instalación normal de
# XappiensOS la hibernación no está configurada (no hay resume=, el swapfile
# es menor que la RAM y zram no sirve para guardar la imagen), así que el
# equipo se queda colgado en "hibernation entry" hasta que la batería muere.
# El resultado es un corte de corriente: journal del disco por recuperar,
# partición EFI marcada como sucia y, en algunos portátiles, el controlador
# embebido limitando la CPU a su frecuencia mínima. Ver docs/power-loss.md.
#
# PowerOff pide a logind un apagado ordenado, que siempre funciona. Los
# umbrales dejan margen: cerca del vacío algunas baterías (p. ej. ASUS) dejan
# de informar bien de su carga (_BST falla) y el porcentaje cae a saltos.
#
# Para volver a hibernar en un equipo con hibernación configurada, crea
# /etc/UPower/UPower.conf.d/90-local.conf con CriticalPowerAction=HybridSleep.
[UPower]
UsePercentageForPolicy=true
PercentageLow=15.0
PercentageCritical=8.0
PercentageAction=5.0
CriticalPowerAction=PowerOff
