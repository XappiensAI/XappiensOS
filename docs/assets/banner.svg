<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="XappiensOS — Linux libre con escritorio COSMIC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#524B62"/>
      <stop offset="1" stop-color="#738794"/>
    </linearGradient>
    <pattern id="px" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#E0EDED" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#px)"/>

  <!-- pixel bulb motif -->
  <g transform="translate(1000 40)" opacity="0.95">
    <g fill="#D5A57D">
      <rect x="48" y="16" width="48" height="12"/>
      <rect x="36" y="28" width="12" height="12"/><rect x="96" y="28" width="12" height="12"/>
      <rect x="24" y="40" width="12" height="60"/><rect x="108" y="40" width="12" height="60"/>
      <rect x="36" y="100" width="12" height="12"/><rect x="96" y="100" width="12" height="12"/>
      <rect x="48" y="112" width="12" height="24"/><rect x="84" y="112" width="12" height="24"/>
    </g>
    <g fill="#E8C984">
      <rect x="48" y="28" width="48" height="12"/>
      <rect x="36" y="40" width="72" height="60"/>
      <rect x="48" y="100" width="48" height="12"/>
      <rect x="60" y="112" width="24" height="24"/>
    </g>
    <rect x="84" y="40" width="12" height="36" fill="#FFF6D6"/>
    <rect x="72" y="40" width="12" height="12" fill="#FFF6D6"/>
    <rect x="48" y="136" width="48" height="24" fill="#E0EDED"/>
    <rect x="60" y="160" width="24" height="12" fill="#2E2A38"/>
    <g fill="#E0EDED" opacity="0.8">
      <rect x="0" y="64" width="12" height="12"/><rect x="132" y="64" width="12" height="12"/>
      <rect x="12" y="12" width="12" height="12"/><rect x="120" y="12" width="12" height="12"/>
      <rect x="12" y="120" width="12" height="12"/><rect x="120" y="120" width="12" height="12"/>
    </g>
  </g>

  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="112" font-size="68" font-weight="700" fill="#FFFFFF" letter-spacing="1">XappiensOS</text>
    <text x="64" y="156" font-size="26" fill="#E8C984">Linux · COSMIC · Open Source</text>
    <text x="64" y="200" font-size="20" fill="#E0EDED">Tu escritorio. A tu manera.  ·  Your desktop. Your way.</text>
  </g>
  <g transform="translate(64 222)">
    <rect width="40" height="6" fill="#D5A57D"/>
    <rect x="44" width="40" height="6" fill="#E8C984"/>
    <rect x="88" width="40" height="6" fill="#738794"/>
    <rect x="132" width="40" height="6" fill="#E0EDED"/>
  </g>
</svg>
